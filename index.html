    <style>
      /* Minimal boot splash so the first paint is never a blank white page.
         React replaces #root (and this splash) as soon as it mounts. */
      html,
      body {
        margin: 0;
        background: #0f172a;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 50% at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 60%), #0f172a;
      }
      #boot-splash .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #boot-splash .spinner {
        transform-origin: 50% 50%;
        animation: hosanna-spin 1s linear infinite;
      }
      #boot-splash .spinner-track {
        stroke: rgba(255, 255, 255, 0.12);
      }
      #boot-splash .spinner-indicator {
        stroke: #1973b2;
        stroke-linecap: round;
        stroke-dasharray: 44 132;
      }
      #boot-splash .loader-text {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
      }
      @keyframes hosanna-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .spinner {
          animation: none;
        }
        #boot-splash .spinner-indicator {
          stroke-dasharray: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Restore the visitor's preferred language before first paint so the
      // document never flashes the wrong language.
      try {
        var lang = localStorage.getItem("hosanna_lang");
        if (!lang) {
          var userLangs = navigator.languages || [navigator.language];
          for (var i = 0; i < userLangs.length; i++) {
            var c = (userLangs[i] || "").toLowerCase().split("-")[0];
            if (c === "pt" || c === "es" || c === "en") {
              lang = c;
              break;
            }
          }
        }
        if (lang) {
          document.documentElement.lang = lang;
        }
      } catch (e) {}
    </script>

              stroke-width="4"
            ></circle>
          </svg>

    </div>
