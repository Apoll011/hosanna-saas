    <style>
      /* Minimal boot splash so the first paint is never a blank white page.
         React replaces #root (and this splash) as soon as it mounts. */
      html,
      body {
        margin: 0;
        background: #0f172a;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 50% at 50% 0%, rgba(255, 255, 255, 0.08) 0%, transparent 60%), #0f172a;
      }
      #boot-splash .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0284c7, #0ea5e9);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
        font-weight: 700;
        color: #fff;
        animation: hosanna-pulse 1.4s ease-in-out infinite;
      }
      @keyframes hosanna-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Restore the visitor's preferred language before first paint so the
      // document never flashes the wrong language.
      try {
        var lang = localStorage.getItem("hosanna_lang");
        if (!lang) {
          var userLangs = navigator.languages || [navigator.language];
          for (var i = 0; i < userLangs.length; i++) {
            var c = (userLangs[i] || "").toLowerCase().split("-")[0];
            if (c === "pt" || c === "es" || c === "en") {
              lang = c;
              break;
            }
          }
        }
        if (lang) {
          document.documentElement.lang = lang;
        }
      } catch (e) {}
    </script>

    <div id="root">
      <div id="boot-splash">
        <div class="mark">H</div>
      </div>
    </div>
